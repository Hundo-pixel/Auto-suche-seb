# Baut die Seite neu, wenn sich die App (web/) ändert – und, wenn ein lokaler Scraper (Pi/Docker) die Daten liefert,
# zusätzlich regelmäßig per Zeitplan.
#
# Hinweis: Ein Push in den Branch "data" kann diesen Workflow NICHT auslösen – GitHub startet Workflows nur aus der
# .github/workflows-Version des gepushten Branches, und "data" enthält nur Daten. Deshalb der Zeitplan unten.
name: deploy-pages

on:
  push:
    branches: [main]          # nur main darf nach GitHub Pages veröffentlichen
    paths-ignore: ["scraper/**", "**.md"]
  schedule:
    - cron: "47 */2 * * *"     # nur aktiv, wenn SCRAPE_IN_ACTIONS=false (lokaler Scraper pusht nach "data")
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'schedule' || vars.SCRAPE_IN_ACTIONS == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Daten aus Branch "data"
        run: |
          mkdir -p _site && cp -r web/. _site/
          if git fetch --depth=1 origin data:data 2>/dev/null; then
            git worktree add .state data && cp -r .state/site/. _site/data/ || true
          else
            echo "Noch keine Daten – Seite zeigt Hinweis"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
