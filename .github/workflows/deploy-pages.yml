# Baut die Seite neu, wenn sich die App (web/) ändert oder ein lokaler Scraper neue Daten in "data" pusht.
name: deploy-pages

on:
  push:
    branches: [main, master, data]
    paths-ignore: ["scraper/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Daten aus Branch "data"
        run: |
          mkdir -p _site && cp -r web/. _site/
          if git fetch --depth=1 origin data:data 2>/dev/null; then
            git worktree add .state data && cp -r .state/site/. _site/data/ || true
          else
            echo "Noch keine Daten – Seite zeigt Hinweis"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
