# Geplanter Scraper-Lauf auf GitHub Actions (kostenlos für öffentliche Repos).
# Ablauf: Zustand (SQLite + Thumbnails) aus dem Branch "data" holen -> scrapen -> zurückschreiben -> Pages deployen.
# Wenn Portale GitHub-IPs blocken, siehe README ("Lokal per Docker/Raspberry Pi"); dann die Variable
# SCRAPE_IN_ACTIONS=false setzen – der Workflow deployt dann nur noch.
name: scrape

on:
  schedule:
    - cron: "17 */6 * * *"     # alle 6 Stunden (UTC), bewusst nicht zur vollen Stunde
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    if: vars.SCRAPE_IN_ACTIONS != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Zustand aus Branch "data" holen
        run: |
          git fetch --depth=1 origin data:data 2>/dev/null && git worktree add .state data || {
            echo "Branch data existiert noch nicht – starte leer"; mkdir -p .state; }
          mkdir -p .state/site

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Abhängigkeiten
        run: pip install -r scraper/requirements.txt

      - name: CLIP-Modell aus Cache
        uses: actions/cache@v4
        with:
          path: scraper/models_cache
          key: clip-vit-b32-quantized-v1

      - name: CLIP-Modell laden (falls nicht im Cache)
        run: python scraper/tools/fetch_clip.py || echo "CLIP nicht verfügbar – Heuristik wird genutzt"

      - name: Tests
        working-directory: scraper
        run: python -m pytest -q

      - name: Scrapen
        working-directory: scraper
        run: python -m autosuche.run --db ../.state/autosuche.sqlite --out ../.state/site

      - name: Zustand zurückschreiben (Branch data, ohne Historie -> Repo bleibt klein)
        run: |
          rm -rf "$RUNNER_TEMP/pub" && mkdir -p "$RUNNER_TEMP/pub"
          cp -r .state/. "$RUNNER_TEMP/pub/" && rm -rf "$RUNNER_TEMP/pub/.git"
          cd "$RUNNER_TEMP/pub"
          git init -q -b data
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Daten $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data

      - name: Seite zusammenbauen
        run: |
          mkdir -p _site && cp -r web/. _site/
          cp -r .state/site/. _site/data/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
